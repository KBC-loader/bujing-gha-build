# Platform 触发的 Host 云构建：iOS（unsigned IPA）/ iOS SDK / macOS / Windows Desktop
# Android APK / Android SDK / Web → CNB（见 docs/CNB云构建.md）
# 由 Backend workflow_dispatch 调用；勿手动改 inputs 语义。
name: Bujing Platform Host Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Platform build id (run-name suffix)
        required: true
        type: string
      target:
        description: ios | ios-sdk | macos | windows
        required: true
        type: choice
        options:
          - ios
          - ios-sdk
          - macos
          - windows
      source_url:
        description: Staged host source.zip URL (Platform)
        required: true
        type: string
      source_token:
        description: HMAC token for source_url
        required: true
        type: string
      flutter_version:
        description: Flutter SDK version
        required: false
        default: "3.47.3"
        type: string
      runtime_url:
        description: BUJING_RUNTIME dart-define (ios-sdk)
        required: false
        default: ""
        type: string
      project_id:
        description: BUJING_PROJECT_ID dart-define (ios-sdk 编排分桶)
        required: false
        default: ""
        type: string

run-name: bujing-gha-${{ inputs.build_id }}-${{ inputs.target }}

concurrency:
  group: bujing-gha-${{ inputs.build_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ${{ fromJSON('{"windows":"windows-latest","ios":"macos-latest","ios-sdk":"macos-latest","macos":"macos-latest"}')[inputs.target] }}
    timeout-minutes: ${{ fromJSON('{"windows":30,"ios":60,"ios-sdk":60,"macos":60}')[inputs.target] }}

    steps:
      - name: Download staged host source (Unix)
        if: inputs.target != 'windows'
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_TOKEN: ${{ inputs.source_token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "X-Bujing-Gha-Token: ${SOURCE_TOKEN}" -o source.zip "${SOURCE_URL}"
          mkdir -p host-src
          unzip -q source.zip -d host-src
          if [ "${{ inputs.target }}" = "ios-sdk" ]; then
            mapfile -t modules < <(find host-src -mindepth 1 -maxdepth 3 -type d -name 'bujing_android_module')
            if [ "${#modules[@]}" -ne 1 ]; then
              echo "expected exactly one bujing_android_module, got ${#modules[@]}"
              printf '%s\n' "${modules[@]:-}"
              exit 1
            fi
            echo "HOST_DIR=${modules[0]}" >> "$GITHUB_ENV"
          else
            mapfile -t dirs < <(find host-src -mindepth 1 -maxdepth 1 -type d ! -name '__MACOSX')
            if [ "${#dirs[@]}" -ne 1 ]; then
              echo "expected exactly one top-level dir, got ${#dirs[@]}"
              printf '%s\n' "${dirs[@]:-}"
              exit 1
            fi
            echo "HOST_DIR=${dirs[0]}" >> "$GITHUB_ENV"
          fi

      - name: Download staged host source (Windows)
        if: inputs.target == 'windows'
        shell: pwsh
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_TOKEN: ${{ inputs.source_token }}
        run: |
          $headers = @{ 'X-Bujing-Gha-Token' = $env:SOURCE_TOKEN }
          Invoke-WebRequest -Uri $env:SOURCE_URL -Headers $headers -OutFile source.zip
          New-Item -ItemType Directory -Force -Path host-src | Out-Null
          Expand-Archive -Path source.zip -DestinationPath host-src -Force
          $dirs = @(Get-ChildItem host-src -Directory | Where-Object { $_.Name -ne '__MACOSX' })
          if ($dirs.Count -ne 1) {
            throw "expected exactly one top-level dir, got $($dirs.Count)"
          }
          # 无 BOM，避免 HOST_DIR 前缀 \ufeff 导致 working-directory 找不到
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "HOST_DIR=$($dirs[0].FullName)`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Resolve pubspec lock hash
        id: lock
        shell: bash
        run: |
          LOCK="${HOST_DIR}/pubspec.lock"
          if [ -f "$LOCK" ]; then
            HASH=$(sha256sum "$LOCK" | cut -c1-16)
          else
            HASH="no-lock"
          fi
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          # subosito/flutter-action 已导出 PUB_CACHE
          path: ${{ env.PUB_CACHE }}
          key: bujing-gha-pub-${{ runner.os }}-${{ inputs.target }}-${{ steps.lock.outputs.hash }}
          restore-keys: |
            bujing-gha-pub-${{ runner.os }}-${{ inputs.target }}-

      - name: Cache CocoaPods (macOS/iOS)
        if: inputs.target != 'windows'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: bujing-gha-pods-${{ steps.lock.outputs.hash }}
          restore-keys: bujing-gha-pods-

      - name: Flutter pub get
        shell: bash
        working-directory: ${{ env.HOST_DIR }}
        run: flutter pub get

      - name: Build iOS SDK (XCFramework)
        if: inputs.target == 'ios-sdk'
        shell: bash
        working-directory: ${{ env.HOST_DIR }}
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          : "${RUNTIME_URL:?runtime_url required for ios-sdk}"
          : "${PROJECT_ID:?project_id required for ios-sdk}"
          OUT="$RUNNER_TEMP/framework-out"
          mkdir -p "$OUT"
          flutter build ios-framework --release --no-debug --no-profile \
            --dart-define=BUJING_RUNTIME="${RUNTIME_URL}" \
            --dart-define=BUJING_PROJECT_ID="${PROJECT_ID}" \
            --output="$OUT"
          mkdir -p "$RUNNER_TEMP/artifact/ios-sdk"
          (cd "$OUT" && zip -r "$RUNNER_TEMP/artifact/ios-sdk/frameworks.zip" .)

      - name: Build iOS IPA (unsigned)
        if: inputs.target == 'ios'
        shell: bash
        working-directory: ${{ env.HOST_DIR }}
        run: |
          set -euo pipefail
          # 勿用 `flutter build ipa` / 勿依赖 Flutter 对 xcodebuild 失败的 Team 兜底提示。
          # --config-only 把 DART_OBFUSCATION / SPLIT_DEBUG_INFO 写入 Generated.xcconfig；
          # 真正混淆在后续 xcodebuild → Flutter assemble 阶段生效（官方用法）。
          flutter build ios --release --no-codesign --config-only \
            --obfuscate --split-debug-info=build/debug-info
          # CODE_SIGNING_ALLOWED=NO 已足够；勿显式传空 DEVELOPMENT_TEAM（部分 Xcode 会当成非法 Team）
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            BUILD_DIR="${PWD}/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            COMPILER_INDEX_STORE_ENABLE=NO
          APP=""
          for candidate in \
            "build/ios/iphoneos/Runner.app" \
            "build/ios/Release-iphoneos/Runner.app"; do
            if [ -d "$candidate" ]; then
              APP="$candidate"
              break
            fi
          done
          if [ -z "$APP" ]; then
            mapfile -t apps < <(find build/ios -path '*/Runner.app' -type d 2>/dev/null)
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "expected exactly one Runner.app under build/ios, got ${#apps[@]}"
              printf '%s\n' "${apps[@]:-}"
              find build/ios -maxdepth 4 -type d 2>/dev/null || true
              exit 1
            fi
            APP="${apps[0]}"
          fi
          mkdir -p "$RUNNER_TEMP/artifact/ios"
          rm -rf "$RUNNER_TEMP/artifact/ios/Payload"
          mkdir -p "$RUNNER_TEMP/artifact/ios/Payload"
          cp -R "$APP" "$RUNNER_TEMP/artifact/ios/Payload/Runner.app"
          (cd "$RUNNER_TEMP/artifact/ios" && zip -qr Runner.ipa Payload)
          rm -rf "$RUNNER_TEMP/artifact/ios/Payload"
          # 符号表供 flutter symbolize；Platform 只取 .ipa，同 artifact 内多文件可兼容
          if [ -d build/debug-info ]; then
            mkdir -p "$RUNNER_TEMP/artifact/ios/debug-info"
            cp -a build/debug-info/. "$RUNNER_TEMP/artifact/ios/debug-info/"
          fi

      - name: Build macOS Desktop
        if: inputs.target == 'macos'
        shell: bash
        working-directory: ${{ env.HOST_DIR }}
        run: |
          # unsigned：Gatekeeper 会拦；内部分发需手动 xattr -cr，或另行 codesign + notarytool
          flutter build macos -t lib/main_desktop.dart --release
          PRODUCTS="build/macos/Build/Products/Release"
          mapfile -t apps < <(find "$PRODUCTS" -maxdepth 1 -name '*.app')
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "expected exactly one .app under $PRODUCTS, got ${#apps[@]}"
            printf '%s\n' "${apps[@]:-}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/artifact/macos"
          cp -R "${apps[0]}" "$RUNNER_TEMP/artifact/macos/"

      - name: Build Windows Desktop
        if: inputs.target == 'windows'
        shell: pwsh
        working-directory: ${{ env.HOST_DIR }}
        run: |
          flutter build windows -t lib/main_desktop.dart --release
          $candidates = @(
            'build\windows\x64\runner\Release',
            'build\windows\runner\Release'
          )
          $releaseDir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $releaseDir) { throw 'Windows Release output not found' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\artifact\windows" | Out-Null
          Copy-Item -Path "$releaseDir\*" -Destination "$env:RUNNER_TEMP\artifact\windows" -Recurse -Force

      - name: Upload artifact (iOS SDK)
        if: inputs.target == 'ios-sdk'
        uses: actions/upload-artifact@v4
        with:
          name: bujing-host-${{ inputs.build_id }}
          path: ${{ runner.temp }}/artifact/ios-sdk
          retention-days: 3

      - name: Upload artifact (iOS)
        if: inputs.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: bujing-host-${{ inputs.build_id }}
          path: ${{ runner.temp }}/artifact/ios
          retention-days: 3

      - name: Upload artifact (macOS)
        if: inputs.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: bujing-host-${{ inputs.build_id }}
          path: ${{ runner.temp }}/artifact/macos
          retention-days: 3

      - name: Upload artifact (Windows)
        if: inputs.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: bujing-host-${{ inputs.build_id }}
          path: ${{ runner.temp }}/artifact/windows
          retention-days: 3
