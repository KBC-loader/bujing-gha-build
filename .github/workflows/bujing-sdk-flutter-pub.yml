# 公共 Flutter SDK → pub.dev（在 GHA 发，避免 CNB 国内节点连 pub.dev / Google OAuth 卡住）。
# 触发：CNB web_trigger_sdk_flutter → 源码包上七牛 → workflow_dispatch。
# 本文件需同步到 BUJING_GHA_REPO（scripts/ci/sync-sdk-flutter-workflow.mjs）。
#
# GitHub Secrets（构造仓）：
#   PUB_CREDENTIALS — dart pub login 后的 credentials.json 全文
name: Bujing SDK Flutter pub.dev

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: bujing_sdui 源码包（tar.gz）地址，由 CNB 上传七牛后给出
        required: true
        type: string
      source_token:
        description: 下载源码包时附加的 X-Bujing-Gha-Token（可选）
        required: false
        default: ""
        type: string
      sdk_version:
        description: semver（与 packages/bujing_sdui 对齐，仅日志）
        required: true
        type: string
      flutter_version:
        description: Flutter SDK 版本
        required: false
        default: "3.47.3"
        type: string
      dry_run:
        description: 只 dry-run，不实际上传
        required: false
        default: "false"
        type: string

run-name: bujing-sdk-flutter-${{ inputs.sdk_version }}

concurrency:
  group: bujing-sdk-flutter-pub
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download staged package
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_TOKEN: ${{ inputs.source_token }}
        run: |
          set -euo pipefail
          if [ -n "${SOURCE_TOKEN}" ]; then
            curl -fsSL -H "X-Bujing-Gha-Token: ${SOURCE_TOKEN}" -o source.tar.gz "${SOURCE_URL}"
          else
            curl -fsSL -o source.tar.gz "${SOURCE_URL}"
          fi
          mkdir -p src
          tar -xzf source.tar.gz -C src
          test -f src/packages/bujing_sdui/pubspec.yaml
          echo "version line: $(grep -E '^version:' src/packages/bujing_sdui/pubspec.yaml | head -1)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Write pub credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${PUB_CREDENTIALS}" ]; then
            echo "缺少 GitHub Secret PUB_CREDENTIALS（构造仓 Settings → Secrets）"
            exit 1
          fi
          mkdir -p "${HOME}/.config/dart" "${HOME}/.pub-cache"
          printf '%s' "${PUB_CREDENTIALS}" > "${HOME}/.config/dart/pub-credentials.json"
          cp -f "${HOME}/.config/dart/pub-credentials.json" "${HOME}/.pub-cache/credentials.json"
          echo "credentials bytes=$(wc -c < "${HOME}/.config/dart/pub-credentials.json")"

      - name: pub get
        working-directory: src/packages/bujing_sdui
        run: |
          set -euo pipefail
          flutter pub get

      - name: pub publish
        working-directory: src/packages/bujing_sdui
        env:
          # 强制正式站；勿用国内镜像（镜像不收包）
          PUB_HOSTED_URL: https://pub.dev
        run: |
          set -euo pipefail
          echo "PUB_HOSTED_URL=${PUB_HOSTED_URL}"
          curl -fsS --connect-timeout 15 --max-time 45 -o /dev/null \
            "https://pub.dev/api/packages/bujing_sdui" \
            || { echo "cannot reach pub.dev"; exit 1; }
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ inputs.dry_run }}" = "1" ]; then
            echo "==> dry-run"
            flutter pub publish --dry-run
          else
            echo "==> publish --force"
            flutter pub publish --force
          fi
          echo "==> done sdk_version=${{ inputs.sdk_version }}"
